# The Motiff Lab iPad app (decision record 0019): SwiftUI over the one C# music-core. XcodeGen makes
# MotiffLab.xcodeproj from this file (not committed). First build the two frameworks:
#   ipad/Core/build.sh        music-core with NativeAOT -> ipad/build/MotiffLabCore.xcframework
#   ipad/Verovio/build.sh     Verovio from source       -> ipad/build/Verovio.xcframework, ipad/build/verovio-data
# then run xcodegen in this folder (ipad/README.md).
name: MotiffLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # music-core is built for Apple silicon only; a Release build for the simulator would otherwise also ask
    # for an Intel (x86_64) slice and drop the arm64 one.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  MotiffLab:
    type: application
    platform: iOS
    sources:
      - path: MotiffLab
      # The example piece, the interface's words and the design tokens are the web app's own files.
      - path: ../../design/kit/elise.musicxml
        buildPhase: resources
      - path: ../../design/kit/tokens.css
        buildPhase: resources
      - path: ../../src/MotiffLab.Web/wwwroot/i18n
        type: folder
        buildPhase: resources
      # The piano the web app plays (tools/piano): 30 MP3 samples and piano.json.
      - path: ../../src/MotiffLab.Web/wwwroot/audio/piano
        type: folder
        buildPhase: resources
      # Verovio's font data and licence (ipad/Verovio/build.sh), copied into the app as a folder.
      - path: ../build/verovio-data
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../build/MotiffLabCore.xcframework
        embed: true
        codeSign: true
      - framework: ../build/Verovio.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motiff Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Projects are files in the app's Documents, shown in the Files app (0019).
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  MotiffLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MotiffLabTests
    dependencies:
      - target: MotiffLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  MotiffLab:
    build:
      targets:
        MotiffLab: all
        MotiffLabTests: [test]
    test:
      targets:
        - MotiffLabTests
    run:
      config: Release
