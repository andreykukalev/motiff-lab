<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8E3D9" />
    <title>Motiff Lab</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- The design kit's tokens (design/kit/tokens.css, 0018), then the app's styles built on them. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // The theme before the first frame (Scripts/layout/theme.ts does the same once the app runs): the stored
        // choice of appearance.theme, else the device's light or dark appearance.
        (function () {
            var root = document.documentElement, choice = null;
            try { choice = localStorage.getItem("motiff-lab:appearance.theme"); } catch (e) { }
            var dark = choice === "night" || choice === "slate" || (choice !== "daylight" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
            root.setAttribute("data-theme", dark ? "dark" : "light");
            if (choice === "slate") { root.setAttribute("data-page", "slate"); }
        })();
    </script>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="MotiffLab.Web.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <!-- The web test site marks its tab: «Тест · » in the title and a dot on the icon (Scripts/layout/test-site.ts). -->
    <script type="module" src="js/layout/test-site.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
