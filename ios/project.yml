# The Motiff Lab iPad app (docs/decisions/0015-ipad-app.md). XcodeGen makes MotiffLab.xcodeproj from this
# file, so the project is never edited by hand and never committed: brew install xcodegen, then xcodegen
# in this folder. Signing and the web app's address are in Config/Base.xcconfig and your Config/Local.xcconfig.
name: MotiffLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MotiffLab:
    type: application
    platform: iOS
    sources:
      - path: MotiffLab
    settings:
      base:
        # iPad only for now; the iPhone layout comes later (docs/ios in PR #120).
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: MotiffLab/Info.plist
      properties:
        CFBundleDisplayName: Motiff Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: Charcoal
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # The web app the shell opens (AppConfig.swift), and the one app-bound domain: WebKit runs its
        # service worker only for app-bound domains, which is what lets the app open offline.
        MotiffWebURL: https://$(MOTIFF_WEB_HOST)/
        WKAppBoundDomains:
          - $(MOTIFF_WEB_HOST)
        NSCameraUsageDescription: Motiff Lab uses the camera to photograph a page of sheet music for scanning.
        NSMicrophoneUsageDescription: Motiff Lab uses the microphone when you record a video or sound to turn into notes.
