# Minimum risk class by path (AOM v1.3, "Risk classification" > "Minimum by path"), checked against main = 27453f9.
# Patterns are from the repository root, glob as in CODEOWNERS: * stays within a folder, ** crosses folders.
# A file gets the highest class of every pattern it matches; a file no pattern matches gets standard.
# A task's minimum is the highest over every file of its diff, old and new paths of renames included.
# Read by governance/metrics/collect.mjs. Changing this file is a Guardrail task (E3).
guardrail:
  - .github/**
  - infra/**
  - governance/**
  - .claude/**
  - CLAUDE.md
  # The protected acceptance scenarios (#310): CI fails a pull request that changes them without protected-scenarios-ok.
  - tests/backend/Acceptance/**
  # The UX baseline and its scenarios (docs/ux-baseline.md): the same label guards them.
  - docs/ux-baseline.md
  - tests/ipad/Baseline/**
  - tests/contracts/page-scenarios/**
high:
  - src/backend/MotiffLab.MusicCore/Facade/**
  - src/backend/MotiffLab.MusicCore/Projects/**
  - src/ipad/Core/**
  - docs/project-file.md
  # High while api.yml deploys the API on every change here; standard once that deploy waits for approval in the
  # Environment production and Andrei lowers it.
  - src/backend/MotiffLab.MusicCore/**
  - src/backend/MotiffLab.Api/**
  - src/backend/omr/**
  # The score, roll, storage and playback scripts, words and piano the iPad bundles (docs/repository-structure.md).
  - src/shared/**
standard:
  - tests/**
  - src/ipad/App/**
  - design/kit/**
  - docs/architecture/adr/**
low:
  # Archived code is not built, tested or deployed (docs/web-archive.md).
  - archive/**
  - docs/**
  - README.md
