# Builds the iPad's music-core framework (src/ipad/Core/build.sh) on develop after a change to it, and keeps it in the
# Actions cache. Pull requests to develop can read develop's caches, so their iPad runs take the core from there
# instead of three NativeAOT builds (8-10 minutes). No one waits for this run.
name: iPad core
run-name: ${{ format('iPad core cache · push to {0}', github.ref_name) }}

on:
  push:
    branches: [develop]
    paths:
      - src/backend/MotiffLab.MusicCore/**
      - src/ipad/Core/**
      - global.json
      - Directory.Build.props
      - .github/workflows/ipad-core.yml

permissions:
  contents: read

concurrency:
  group: ipad-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Andrei's Mac as a self-hosted runner when the repository variable IPAD_RUNNER names its label (motiff-mac);
    # GitHub's macOS otherwise, and always for a pull request from a fork (docs/repository-structure.md, "iPad builds").
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-15' || vars.IPAD_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The same key as ipad.yml's: the same sources give the same framework.
      - uses: actions/cache/restore@v4
        id: core
        with:
          path: src/ipad/build/MotiffLabCore.xcframework
          key: core-ios-${{ hashFiles('src/backend/MotiffLab.MusicCore/**', 'src/ipad/Core/**', 'global.json', 'Directory.Build.props') }}
          lookup-only: true

      - name: Build and check the core
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          src/ipad/Core/build.sh
          dotnet publish src/ipad/Core -c Release -r osx-arm64 -o "$RUNNER_TEMP/core" -warnaserror | tail -1
          python3 src/ipad/Core/check.py "$RUNNER_TEMP/core/MotiffLabCore.dylib"

      - uses: actions/cache/save@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: src/ipad/build/MotiffLabCore.xcframework
          key: ${{ steps.core.outputs.cache-primary-key }}
