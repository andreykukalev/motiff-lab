# The iPad app (decision record 0019): builds music-core with NativeAOT and Verovio from source as frameworks,
# generates the Xcode project, runs the Swift tests in the iPad simulator and builds for a real iPad (unsigned).
# macOS runners are scarce and slow, so it never runs by itself: only on a pull request with the label `ipad-tests`,
# by hand from the Actions tab (on main, which also refreshes the Verovio cache every pull request reads), and for an
# iPad release tag (ipad-v*). Not part of CI and its five minutes. Releases are built by Andrei in Xcode. Run by hand with
# "Screenshots" ticked, or for a release tag, it also photographs the app's screens for the mockups (the Screens scheme).
name: iPad

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Photograph the app's screens (Russian, landscape and portrait, light and dark)
        type: boolean
        default: false
  # Every version tag (governance/README.md, "Versions"), and the old iPad release tags.
  push:
    tags: ['v*', 'ipad-v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A pull request without the label gets a group of its own, so pushing to it does not cancel a run under way.
concurrency:
  group: ipad-${{ github.ref }}${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ipad-tests') || github.event.action == 'labeled' && github.event.label.name != 'ipad-tests') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ipad:
    # A pull request runs it only with the label ipad-tests; of labels, only adding that one starts a run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ipad-tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ipad-tests'))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          dotnet --version

      # The simulator boots while the frameworks build, instead of inside the test step.
      - name: Start the iPad simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          ipads = [d for d in devices if d["name"].startswith("iPad Pro")] or [d for d in devices if d["name"].startswith("iPad")]
          print(ipads[-1]["udid"])')
          echo "Simulator: $(xcrun simctl list devices | grep "$id")"
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id" || true

      - name: Build MotiffLabCore.xcframework
        run: ipad/Core/build.sh | tee core.log

      # The core as a macOS library, called through its C functions as the app calls it.
      - name: Check the core's C functions
        run: |
          dotnet publish ipad/Core -c Release -r osx-arm64 -o "$RUNNER_TEMP/core" -warnaserror | tail -1
          python3 ipad/Core/check.py "$RUNNER_TEMP/core/MotiffLabCore.dylib"

      # Verovio takes several minutes to compile; its build changes only with the script and the patch.
      - uses: actions/cache/restore@v4
        id: verovio
        with:
          path: |
            ipad/build/Verovio.xcframework
            ipad/build/verovio-data
          key: verovio-ios-${{ hashFiles('ipad/Verovio/build.sh', 'ipad/Verovio/verovio-classic-locale.patch') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        run: ipad/Verovio/build.sh | tee verovio.log

      # Saved straight after the build, so a failing test later does not throw the build away.
      - uses: actions/cache/save@v4
        if: steps.verovio.outputs.cache-hit != 'true'
        with:
          path: |
            ipad/build/Verovio.xcframework
            ipad/build/verovio-data
          key: ${{ steps.verovio.outputs.cache-primary-key }}

      # The score's scripts are the web app's (Scripts/score, compiled to wwwroot/js/score): the iPad's web view runs
      # the same score geometry and pencil marks (0019 section 1.4).
      - name: Compile the web app's score scripts
        run: dotnet build src/MotiffLab.Web -c Release -warnaserror | tail -3

      # Xcode in the IDE refuses a project that xcodebuild only warns about (a file in two groups), so the warning fails here.
      - name: Generate the Xcode project
        working-directory: ipad/App
        run: |
          xcodegen
          xcodebuild -list -project MotiffLab.xcodeproj 2>&1 | tee list.log
          if grep -q "member of multiple groups" list.log; then echo "::error::The generated project puts a file in two groups"; exit 1; fi

      # The Swift packages (MSAL) are fetched once per project.yml, not on every run.
      - uses: actions/cache@v4
        with:
          path: ipad/build/packages
          key: ipad-packages-${{ hashFiles('ipad/App/project.yml') }}

      - name: Test in the iPad simulator
        working-directory: ipad/App
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b > /dev/null
          set -o pipefail
          xcodebuild test -project MotiffLab.xcodeproj -scheme MotiffLab -destination "id=$SIMULATOR" \
            -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test Case|error:|OPEN-AND-ENGRAVE|MSAL-CLIENT|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      # The screens as a player sees them (MotiffLabScreens/ScreensUITests.swift), for the redesign's mockups. A screen the
      # walk cannot reach is listed as SCREEN-MISS and costs that picture only.
      - name: Photograph the screens
        if: github.event_name == 'push' || inputs.screenshots
        working-directory: ipad/App
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          TEST_RUNNER_SCREENS_DIR="$RUNNER_TEMP/screens" xcodebuild test -project MotiffLab.xcodeproj -scheme Screens \
            -destination "id=$SIMULATOR" -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO \
            > screens.log 2>&1 || echo "::warning::The screenshot walk did not finish cleanly; see screens.log"
          grep -E "SCREEN|error:|\*\* TEST" screens.log || true
          echo "SCREENS=$(ls "$RUNNER_TEMP/screens" | wc -l | tr -d ' ')" >> "$GITHUB_ENV"
          cp screens.log "$RUNNER_TEMP/screens/"

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'push' || inputs.screenshots)
        with:
          name: ipad-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      # On main and by hand: a pull request's Swift is already compiled by the tests.
      - name: Build for a real iPad (unsigned)
        if: github.event_name != 'pull_request'
        working-directory: ipad/App
        run: |
          set -o pipefail
          xcodebuild build -project MotiffLab.xcodeproj -scheme MotiffLab -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build -clonedSourcePackagesDirPath ../build/packages \
            CODE_SIGNING_ALLOWED=NO | tail -5
          app=$(find build -name MotiffLab.app -path '*iphoneos*' | head -1)
          echo "APP_SIZE=$(du -sh "$app" | cut -f1)" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "## iPad app"
            echo
            echo '```'
            grep -E '^ios|^iossim' core.log || true
            grep -E '^verovio' verovio.log 2>/dev/null || echo "verovio: from the cache"
            echo "Device app (Release, unsigned): ${APP_SIZE:-not built (pull request)}"
            echo "Screenshots: ${SCREENS:-not taken}"
            grep -h 'OPEN-AND-ENGRAVE' ipad/App/test.log 2>/dev/null || true
            grep -hE "Executed [0-9]+ tests" ipad/App/test.log 2>/dev/null | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ipad-test-log
          path: ipad/App/test.log
          if-no-files-found: ignore
