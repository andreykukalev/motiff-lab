# The iPad app (decision record 0019): builds music-core with NativeAOT and Verovio from source as frameworks,
# generates the Xcode project, runs the Swift tests in the iPad simulator and builds for a real iPad (unsigned).
# macOS runners are scarce and slow: a pull request that touches the app's sources only compiles the app and its tests
# (no simulator); the Swift tests run with the label `ipad-tests` (set when the pull request is ready), by hand from the
# Actions tab (on main, which also refreshes the Verovio cache every pull request reads) and for a version tag. Not part
# of CI and its five minutes. Releases are built by Andrei in Xcode. Run by hand with
# "Screenshots" ticked, or for a release tag, it also photographs the app's screens for the mockups (the Screens scheme).
name: iPad
# The run's title in the Actions list says what it is, where and how much of it runs (a pull request without the label
# ipad-tests only compiles).
run-name: >-
  ${{ format('iPad tests · {0}{1}',
  github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title)
  || github.event_name == 'push' && format('tag {0}', github.ref_name)
  || format('by hand on {0}{1}{2}', github.ref_name, inputs.screenshots && ' + screenshots' || '', inputs.switch_test && ' + switch test' || ''),
  github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ipad-tests'
  && format(' · skipped (label {0})', github.event.label.name)
  || github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ipad-tests')
  && ' · compile only (no ipad-tests label)' || '') }}

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Photograph the app's screens (Russian, landscape and portrait, light and dark)
        type: boolean
        default: false
      switch_test:
        description: Switch PDF | Notes 40 times and measure each switch and the memory (tests/ipad/MotiffLabScreens/SwitchUITests.swift, ~30 min)
        type: boolean
        default: false
  # Every version tag (governance/README.md, "Versions"), and the old iPad release tags.
  push:
    tags: ['v*', 'ipad-v*']
  # A pull request that touches nothing the iPad app is built from starts no run at all, label or not (Andrei,
  # 2026-11-16). Tags and runs by hand are not filtered.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - src/ipad/**
      - tests/ipad/**
      - src/shared/**
      - src/backend/MotiffLab.MusicCore/**
      - design/kit/**
      - tests/contracts/**
      - global.json
      - Directory.Build.props
      - .github/workflows/ipad.yml

permissions:
  contents: read

# A newer push cancels the run under way on the same pull request; adding another label gets a group of its own, so
# its skipped run cancels nothing.
concurrency:
  group: ipad-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ipad-tests' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ipad:
    # Of labels, only adding ipad-tests starts a run.
    if: github.event.action != 'labeled' || github.event.label.name == 'ipad-tests'
    # Andrei's Mac as a self-hosted runner when the repository variable IPAD_RUNNER names its label (motiff-mac);
    # GitHub's macOS otherwise, and always for a pull request from a fork (docs/repository-structure.md, "iPad builds").
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-15' || vars.IPAD_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    # The Swift tests in the simulator: for a tag, by hand, and for a pull request with the label ipad-tests. Otherwise the
    # app and its tests are only compiled.
    env:
      FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ipad-tests') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tools
        run: |
          # A self-hosted Mac has it already and its runner account cannot write to /opt/homebrew.
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          dotnet --version

      # The simulator boots while the frameworks build, instead of inside the test step.
      - name: Start the iPad simulator
        if: env.FULL == 'true'
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          ipads = [d for d in devices if d["name"].startswith("iPad Pro")] or [d for d in devices if d["name"].startswith("iPad")]
          print(ipads[-1]["udid"])')
          echo "Simulator: $(xcrun simctl list devices | grep "$id")"
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id" || true

      # The core changes in few pull requests, and its three NativeAOT builds take 8-10 minutes: a build of the same
      # sources is taken from the cache, and its check with it.
      - uses: actions/cache/restore@v4
        id: core
        with:
          path: src/ipad/build/MotiffLabCore.xcframework
          key: core-ios-${{ hashFiles('src/backend/MotiffLab.MusicCore/**', 'src/ipad/Core/**', 'global.json', 'Directory.Build.props') }}

      - uses: actions/cache@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('src/backend/MotiffLab.MusicCore/*.csproj', 'src/ipad/Core/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-macos-

      - name: Build MotiffLabCore.xcframework
        if: steps.core.outputs.cache-hit != 'true'
        run: src/ipad/Core/build.sh | tee core.log

      # The core as a macOS library, called through its C functions as the app calls it.
      - name: Check the core's C functions
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          dotnet publish src/ipad/Core -c Release -r osx-arm64 -o "$RUNNER_TEMP/core" -warnaserror | tail -1
          python3 src/ipad/Core/check.py "$RUNNER_TEMP/core/MotiffLabCore.dylib"

      # Saved only once the check passed, so a broken core is never reused.
      - uses: actions/cache/save@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: src/ipad/build/MotiffLabCore.xcframework
          key: ${{ steps.core.outputs.cache-primary-key }}

      # Verovio takes several minutes to compile; its build changes only with the script and the patch.
      - uses: actions/cache/restore@v4
        id: verovio
        with:
          path: |
            src/ipad/build/Verovio.xcframework
            src/ipad/build/verovio-data
          key: verovio-ios-${{ hashFiles('src/ipad/Verovio/build.sh', 'src/ipad/Verovio/verovio-classic-locale.patch') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        run: src/ipad/Verovio/build.sh | tee verovio.log

      # Saved straight after the build, so a failing test later does not throw the build away.
      - uses: actions/cache/save@v4
        if: steps.verovio.outputs.cache-hit != 'true'
        with:
          path: |
            src/ipad/build/Verovio.xcframework
            src/ipad/build/verovio-data
          key: ${{ steps.verovio.outputs.cache-primary-key }}

      # The score's scripts are the shared layer's (src/shared/Scripts, compiled to wwwroot/js): the iPad's web view runs
      # the score geometry and pencil marks there (0019 section 1.4).
      - name: Compile the shared score scripts
        run: dotnet build src/shared -c Release -warnaserror | tail -3

      # Xcode in the IDE refuses a project that xcodebuild only warns about (a file in two groups), so the warning fails here.
      - name: Generate the Xcode project
        working-directory: src/ipad/App
        run: |
          xcodegen
          xcodebuild -list -project MotiffLab.xcodeproj 2>&1 | tee list.log
          if grep -q "member of multiple groups" list.log; then echo "::error::The generated project puts a file in two groups"; exit 1; fi

      # The Swift packages (MSAL) are fetched once per project.yml, not on every run.
      - uses: actions/cache@v4
        with:
          path: src/ipad/build/packages
          key: ipad-packages-${{ hashFiles('src/ipad/App/project.yml') }}

      - name: Test in the iPad simulator
        if: env.FULL == 'true'
        working-directory: src/ipad/App
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b > /dev/null
          set -o pipefail
          xcodebuild test -project MotiffLab.xcodeproj -scheme MotiffLab -destination "id=$SIMULATOR" \
            -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test Case|error:|OPEN-AND-ENGRAVE|MSAL-CLIENT|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      # A pull request without the label: the app and both test targets compile for the simulator, nothing runs.
      - name: Compile the app and its tests
        if: env.FULL != 'true'
        working-directory: src/ipad/App
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project MotiffLab.xcodeproj -scheme MotiffLab -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" test.log

      # PDF | Notes switched again and again (v0.6.4, #614 section 11): each switch timed on the app's clock and the memory
      # logged; only by hand, as it takes about half an hour.
      - name: Switch PDF | Notes repeatedly
        if: inputs.switch_test
        working-directory: src/ipad/App
        run: |
          set -o pipefail
          TEST_RUNNER_SWITCH_TEST=1 xcodebuild test -project MotiffLab.xcodeproj -scheme Screens \
            -destination "id=$SIMULATOR" -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO \
            -only-testing:MotiffLabScreens/SwitchUITests | tee switch.log | grep -E "SWITCH|Test Case|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" switch.log

      # The screens as a player sees them (tests/ipad/MotiffLabScreens/ScreensUITests.swift), for the redesign's mockups. A screen the
      # walk cannot reach is listed as SCREEN-MISS and costs that picture only.
      - name: Photograph the screens
        if: github.event_name == 'push' || inputs.screenshots
        working-directory: src/ipad/App
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          TEST_RUNNER_SCREENS_DIR="$RUNNER_TEMP/screens" xcodebuild test -project MotiffLab.xcodeproj -scheme Screens \
            -destination "id=$SIMULATOR" -clonedSourcePackagesDirPath ../build/packages CODE_SIGNING_ALLOWED=NO \
            > screens.log 2>&1 || echo "::warning::The screenshot walk did not finish cleanly; see screens.log"
          grep -E "SCREEN|error:|\*\* TEST" screens.log || true
          echo "SCREENS=$(ls "$RUNNER_TEMP/screens" | wc -l | tr -d ' ')" >> "$GITHUB_ENV"
          cp screens.log "$RUNNER_TEMP/screens/"

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'push' || inputs.screenshots)
        with:
          name: ipad-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      # On a tag and by hand: a pull request's Swift is already compiled for the simulator.
      - name: Build for a real iPad (unsigned)
        if: github.event_name != 'pull_request'
        working-directory: src/ipad/App
        run: |
          set -o pipefail
          xcodebuild build -project MotiffLab.xcodeproj -scheme MotiffLab -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build -clonedSourcePackagesDirPath ../build/packages \
            CODE_SIGNING_ALLOWED=NO | tail -5
          app=$(find build -name MotiffLab.app -path '*iphoneos*' | head -1)
          echo "APP_SIZE=$(du -sh "$app" | cut -f1)" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "## iPad app"
            echo
            echo '```'
            grep -E '^ios|^iossim' core.log 2>/dev/null || echo "core: from the cache"
            grep -E '^verovio' verovio.log 2>/dev/null || echo "verovio: from the cache"
            echo "Device app (Release, unsigned): ${APP_SIZE:-not built (pull request)}"
            [ "$FULL" = true ] && echo "Swift tests: run" || echo "Swift tests: compiled only (no ipad-tests label)"
            echo "Screenshots: ${SCREENS:-not taken}"
            grep -h 'OPEN-AND-ENGRAVE' src/ipad/App/test.log 2>/dev/null || true
            grep -hE "Executed [0-9]+ tests" src/ipad/App/test.log 2>/dev/null | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ipad-test-log
          path: src/ipad/App/test.log
          if-no-files-found: ignore
