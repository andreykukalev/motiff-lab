# Spike (spikes/ios-core): builds music-core for the iPad with NativeAOT, runs it in the iPad simulator
# and checks that the device build links; a second job times and profiles Verovio on macOS itself.
# Not part of CI: it runs only when the spike changes, or by hand.
name: iOS core spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/ios-core/**
      - .github/workflows/ios-core-spike.yml

permissions:
  contents: read

concurrency:
  group: ios-core-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          dotnet --version

      - name: Build MotiffLabCore.xcframework
        working-directory: spikes/ios-core
        run: ./build-ios.sh | tee build-ios.log

      # Verovio takes several minutes to compile; its build only changes with the script.
      - uses: actions/cache/restore@v4
        id: verovio
        with:
          path: |
            spikes/ios-core/build/Verovio.xcframework
            spikes/ios-core/build/verovio-data
          key: verovio-ios-${{ hashFiles('spikes/ios-core/build-verovio.sh') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        working-directory: spikes/ios-core
        run: ./build-verovio.sh | tee build-verovio.log

      # Saved straight after the build, so a failing test later does not throw the build away.
      - uses: actions/cache/save@v4
        if: steps.verovio.outputs.cache-hit != 'true'
        with:
          path: |
            spikes/ios-core/build/Verovio.xcframework
            spikes/ios-core/build/verovio-data
          key: ${{ steps.verovio.outputs.cache-primary-key }}

      - name: Generate the Xcode project
        working-directory: spikes/ios-core/ios
        run: xcodegen

      - name: Test in the iPad simulator
        working-directory: spikes/ios-core/ios
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          ipads = [d for d in devices if d["name"].startswith("iPad Pro")] or [d for d in devices if d["name"].startswith("iPad")]
          print(ipads[-1]["udid"])')
          echo "Simulator: $(xcrun simctl list devices | grep "$id")"
          set -o pipefail
          xcodebuild test -project CoreSpike.xcodeproj -scheme CoreSpike -destination "id=$id" CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Build for a real iPad (unsigned)
        working-directory: spikes/ios-core/ios
        run: |
          set -o pipefail
          xcodebuild build -project CoreSpike.xcodeproj -scheme CoreSpike -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -5
          app=$(find build -name CoreSpike.app -path '*iphoneos*' | head -1)
          echo "App size: $(du -sh "$app" | cut -f1)"
          echo "APP_SIZE=$(du -sh "$app" | cut -f1)" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        working-directory: spikes/ios-core
        run: |
          {
            echo "## music-core on iOS (NativeAOT)"
            echo
            echo '```'
            grep -E '^ios|^iossim' build-ios.log || true
            grep -E '^verovio' build-verovio.log 2>/dev/null || echo "verovio: from cache"
            echo "Device app (Release, unsigned): ${APP_SIZE:-not built}"
            echo '```'
            echo
            echo "### Benchmark in the simulator (20 runs; ms: first run / median)"
            echo
            python3 summary.py ios/test.log || echo "No benchmark output."
            echo
            echo "### Engraving with Verovio in the simulator (A4 pages, Leland)"
            echo
            python3 summary.py --engrave ios/test.log || echo "No engraving output."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MotiffLabCore-xcframework
          path: |
            spikes/ios-core/build/MotiffLabCore.xcframework
            spikes/ios-core/ios/test.log
          if-no-files-found: warn

  # The same Verovio and music-core built for macOS on the same kind of runner, timed and profiled
  # outside the simulator: tells a slow simulator from a slow build.
  verovio-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: music-core for macOS (NativeAOT)
        run: dotnet publish spikes/ios-core/CoreBridge -c Release -r osx-arm64 -o "$RUNNER_TEMP/core" | tail -2

      - name: Verovio for macOS
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet --depth 1 --branch version-6.3.0 https://github.com/rism-digital/verovio.git verovio
          cmake -S verovio/cmake -B vrv -DCMAKE_BUILD_TYPE=Release -DBUILD_AS_LIBRARY=ON -DNO_HUMDRUM_SUPPORT=ON > cmake.log
          cmake --build vrv --parallel "$(sysctl -n hw.ncpu)" > build.log
          grep -h '^CXX_FLAGS' vrv/CMakeFiles/verovio.dir/flags.make | cut -c1-60
          ls -la vrv/*.dylib

      - name: Time and profile the engraving
        working-directory: spikes/ios-core
        run: |
          core="$RUNNER_TEMP/core/MotiffLabCore.dylib"
          vrv=$(ls "$RUNNER_TEMP"/vrv/libverovio*.dylib | head -1)
          data="$RUNNER_TEMP/verovio/data"
          for piece in fur-elise-97-bars.musicxml large-5000-notes.mid; do
            python3 native-check/engrave.py "$core" "$vrv" "$data" "assets/$piece" 5 | tee -a "$RUNNER_TEMP/engrave.jsonl"
          done
          MOTIFF_ENGRAVE_LOOP=14 python3 native-check/engrave.py "$core" "$vrv" "$data" assets/fur-elise-97-bars.musicxml &
          pid=$!
          sleep 3
          sample "$pid" 8 -mayDie -file "$RUNNER_TEMP/sample.txt" > /dev/null 2>&1 || true
          wait "$pid"
          {
            echo "## Verovio on macOS (same runner type, outside the simulator)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/engrave.jsonl"
            echo '```'
            echo
            echo "### Where the time goes (sample, top of stack)"
            echo
            echo '```'
            sed -n '/Sort by top of stack/,$p' "$RUNNER_TEMP/sample.txt" | head -45
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Sort by top of stack/,$p' "$RUNNER_TEMP/sample.txt" | head -45

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verovio-macos-profile
          path: ${{ runner.temp }}/sample.txt
          if-no-files-found: warn
