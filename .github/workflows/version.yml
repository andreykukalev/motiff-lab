# Cuts a version (governance/README.md, "Versions"): when VERSION changes on develop (a test version) or main (a stable
# version or a hotfix), it tags that commit v<VERSION>, then starts the iPad and browser tests on the tag. Agents cannot
# push tags from a cloud thread, so a version is a pull request that changes VERSION. A tag pushed with the workflow's
# token starts no other workflow by itself, hence the two explicit runs.
name: Version

on:
  push:
    branches: [develop, main]
    paths: [VERSION]

permissions:
  contents: write
  actions: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag the version and start its tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::VERSION must look like 0.2 or 1.0.1, not '$version'."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists: raise VERSION for a new version."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Version $version from ${GITHUB_REF_NAME}"
          git push origin "refs/tags/$tag"
          gh workflow run ipad.yml --ref "$tag"
          gh workflow run browser-tests.yml --ref "$tag"
          echo "### $tag on ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}: iPad and browser tests started" >> "$GITHUB_STEP_SUMMARY"
