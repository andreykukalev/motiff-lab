name: Scan server

# Publishes the scan server's image (services/omr) to GitHub's container registry and deploys it to
# Azure Container Apps (infra/scan.bicep, decision record 0014). Its own workflow, not a CI step:
# the image is about 2 GB and takes longer to build than CI's 5 minutes. CI still runs its tests.
# The services live in rg-motifflab next to their database and the web app, and sign in as the CI identity
# set up by infra/azure/setup.ps1 (AZURE_SERVICES_*).
# develop deploys the same image to its own group, rg-motifflab-dev (ca-motifflab-scan-dev), by itself and without
# approval, signed in as id-motifflab-github-dev, once infra/azure/dev-env.ps1 has set AZURE_DEV_CLIENT_ID and
# AZURE_DEV_RESOURCE_GROUP (infra/README.md, "The develop environment").
on:
  push:
    branches: [main, develop]
    paths:
      - services/omr/**
      - infra/scan.bicep
      - .github/workflows/scan-server.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per branch, and never cancel one halfway. main's and develop's go to different groups, so a
# develop deploy never waits behind main's approval.
concurrency:
  group: scan-server-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/motiff-omr

jobs:
  # Every deploy from main waits for Andrei: the Environment production has him as its required reviewer and lets only
  # main deploy (infra/github/protect.ps1, governance/roles/common.md). The gate is its own job without an Azure
  # identity, so the OIDC subject Azure trusts (ref:refs/heads/main) stays as it is and nothing changes in Azure.
  # develop needs no approval: it deploys only to rg-motifflab-dev, the only group its identity may change.
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - run: echo "Deploy of ${{ github.sha }} approved."

  # Until infra/azure/dev-env.ps1 has run, a develop run builds and deploys nothing (the image is about 2 GB).
  develop-not-set-up:
    if: github.ref == 'refs/heads/develop' && vars.AZURE_DEV_CLIENT_ID == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::notice::develop's scan server is not deployed: AZURE_DEV_CLIENT_ID is empty. Andrei runs infra/azure/dev-env.ps1 once (infra/README.md, The develop environment)."

  # main after the approval; develop at once, once its environment exists. Any other branch deploys nothing.
  publish-deploy:
    needs: approve
    if: >-
      ${{ !cancelled() && (needs.approve.result == 'success' ||
      (github.ref == 'refs/heads/develop' && vars.AZURE_DEV_CLIENT_ID != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # OIDC sign-in to Azure
    steps:
      - uses: actions/checkout@v4

      # main: rg-motifflab, as set up by infra/azure/setup.ps1. develop: rg-motifflab-dev, by infra/azure/dev-env.ps1.
      - name: Where to deploy
        id: target
        env:
          REF: ${{ github.ref }}
          MAIN_CLIENT_ID: ${{ vars.AZURE_SERVICES_CLIENT_ID }}
          MAIN_GROUP: ${{ vars.AZURE_SERVICES_RESOURCE_GROUP }}
          DEV_CLIENT_ID: ${{ vars.AZURE_DEV_CLIENT_ID }}
          DEV_GROUP: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
        run: |
          if [[ "$REF" == refs/heads/develop ]]; then
            { echo "branch=develop"; echo "tag=develop"; echo "client-id=$DEV_CLIENT_ID"
              echo "group=${DEV_GROUP:-rg-motifflab-dev}"; } >> "$GITHUB_OUTPUT"
          else
            { echo "branch=main"; echo "tag=latest"; echo "client-id=$MAIN_CLIENT_ID"; echo "group=$MAIN_GROUP"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repository; homr's AGPL asks that its source is findable. One package
      # for both branches: each image is tagged by its commit, and the newest also as latest (main) or develop.
      - uses: docker/build-push-action@v6
        with:
          context: services/omr
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=Motiff Lab scan server: homr behind a small HTTP service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Apps pulls the image without credentials, so the package must be public. GitHub makes a
      # new package private, and only its owner can change that, once: see infra/README.md.
      - name: Check the image is public
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE:${{ github.sha }}" > /dev/null; then
            echo "::error::The package motiff-omr is private. Make it public once (Package settings, Change visibility), then re-run this workflow."
            exit 1
          fi

      - uses: azure/login@v2
        if: steps.target.outputs.client-id != ''
        with:
          client-id: ${{ steps.target.outputs.client-id }}
          tenant-id: ${{ vars.AZURE_SERVICES_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SERVICES_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        if: steps.target.outputs.client-id != ''
        env:
          RESOURCE_GROUP: ${{ steps.target.outputs.group }}
        run: |
          url="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "scan-${{ github.run_number }}" \
            --template-file infra/scan.bicep \
            --parameters image="$IMAGE:${{ github.sha }}" \
              authAuthority="${{ vars.AUTH_AUTHORITY }}" authAudience="${{ vars.AUTH_AUDIENCE }}" \
              webHost="${{ vars.WEB_HOST || 'nice-smoke-0169fb403.6.azurestaticapps.net' }}" \
              branch="${{ steps.target.outputs.branch }}" \
            --query properties.outputs.url.value --output tsv)"
          echo "Scan server (${{ steps.target.outputs.branch }}): $url" | tee -a "$GITHUB_STEP_SUMMARY"
