name: AOM verdicts

# The commit status aom-verdicts on a pull request's head commit (Task Records #300, #358, governance/roles/common.md):
# success only when the Reviewer's `approve` and QA's `pass` comments name that exact commit, or when the pull request
# is docs-only (only docs/ and README.md, never docs/project-file.md), which Andrei reviews himself. The rule and the
# parser are .github/scripts/aom-verdicts.mjs; the exact lines it reads are in governance/roles/reviewer.md and qa.md.
#
# Two kinds of event start it, never a label and never CI's build-test:
# - a verdict comment (created, edited, deleted): the status from the comments, or docs-only success;
# - a pull request into main opened, reopened, given a new head commit or moved onto main from another base: the
#   docs-only success at once, or, for any other pull request, the status from the verdicts already posted for that
#   commit (usually none: pending, which the ruleset treats as not passed).
# Both run the definition and the script from main and never check out or run the pull request's code: issue_comment
# always uses the default branch, pull_request_target uses the base branch, which the filter below keeps to main; the
# checkout takes github.sha, the base commit, and the pull request is only read through the API.
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

# One run at a time per pull request, none cancelled: each run reads the files and comments afresh, so the last one to
# finish reports the newest state.
concurrency:
  group: aom-verdicts-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  report:
    # Skipped (no runner) unless: a pull request event other than an edit of the title or body; or a comment on a pull
    # request, by a trusted author, that is or was a verdict.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, 'aom:review') || contains(github.event.comment.body, 'aom:qa') ||
        contains(github.event.changes.body.from, 'aom:review') || contains(github.event.changes.body.from, 'aom:qa')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      # Reads the pull request, its files and its comments (the issue comments endpoint accepts this permission).
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Report aom-verdicts on the head commit
        run: node .github/scripts/aom-verdicts.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
