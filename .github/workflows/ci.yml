name: CI

# The browser tests (tests/e2e) are heavy, so they run only when asked: label a pull request
# `browser-tests`, or run CI from the Actions tab with "Run the browser tests" ticked.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run the browser tests
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Never cancel a run on main:
# it may be provisioning infrastructure. Pull requests group by number, not ref, so a pull request's
# run never shares a group with main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # One job for build, test, publish and deploy: a second job would pay for another runner start, checkout,
  # artifact upload and download, and billing rounds each job up to a whole minute.
  # The job name is the required check, so it always runs and reports; what it skips it skips by step.
  build-test:
    # Of labels, only adding browser-tests starts a run.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' || github.event.label.name == 'browser-tests')
    runs-on: ubuntu-latest
    # CI stays within 5 minutes. The browser suite alone takes about 15 minutes on one worker, so a run
    # that asks for it gets longer.
    timeout-minutes: ${{ (inputs.browser_tests || contains(github.event.pull_request.labels.*.name, 'browser-tests')) && 30 || 5 }}
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SWA_NAME: swa-motifflab
    steps:
      - uses: actions/checkout@v4

      # Documentation-only changes skip the build and tests. Only changes to the app (src, infra, SDK and
      # build settings) are published and deployed; test-only changes are built and tested but not deployed.
      # The browser tests run on the published app only when asked (see the top), and then only when
      # the app or they changed. Any doubt (a commit that cannot be fetched) runs everything asked for.
      - name: Find what changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          BROWSER_ASKED: ${{ inputs.browser_tests || contains(github.event.pull_request.labels.*.name, 'browser-tests') }}
        run: |
          code=true
          app=true
          browser=true
          infra=true
          scan=true
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --depth=1 --no-tags origin "$BASE_SHA" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            echo "$changed"
            code=false
            app=false
            browser=false
            infra=false
            scan=false
            while IFS= read -r f; do
              case "$f" in
                '') ;;
                *.md|docs/*|ios/*|stage1-issues/*|pilot/*|LICENSE*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
                src/*|infra/*|global.json|Directory.Build.props|Directory.Packages.props|MotiffLab.slnx|.github/workflows/ci.yml)
                  code=true
                  app=true
                  browser=true ;;
                tests/e2e/*)
                  code=true
                  browser=true ;;
                services/omr/*) scan=true ;;
                *) code=true ;;
              esac
              case "$f" in
                infra/*) infra=true ;;
              esac
            done <<< "$changed"
          fi
          if [[ "$BROWSER_ASKED" != true ]]; then
            browser=false
          fi
          azure=false
          if [[ "$app" == true && -n "$AZURE_CLIENT_ID" ]] \
            && [[ "${{ github.ref }}" == refs/heads/main && ( "${{ github.event_name }}" == push || "${{ github.event_name }}" == workflow_dispatch ) ]]; then
            azure=true
          fi
          publish=false
          if [[ "$browser" == true || "$azure" == true ]]; then
            publish=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "deploy=$azure" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "code=$code browser=$browser publish=$publish deploy=$azure infra=$infra scan=$scan"

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        if: steps.changes.outputs.code == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore MotiffLab.slnx

      # Whitespace only, without loading the solution (seconds rather than a minute): code style and
      # analyzers fail the build already (EnforceCodeStyleInBuild with warnings as errors).
      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: dotnet format whitespace --folder --verify-no-changes

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build MotiffLab.slnx --configuration Release --no-restore

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test MotiffLab.slnx --configuration Release --no-build

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22

      # The build compiles the TypeScript layer to wwwroot/js; these tests run the compiled engine.
      - name: Test TypeScript layer
        if: steps.changes.outputs.code == 'true'
        run: node --test "tests/web/*.test.mjs"

      # The scan server (services/omr, decision record 0011), with homr replaced by a stand-in: a few seconds.
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.scan == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/omr/requirements-test.txt

      - name: Test scan server
        if: steps.changes.outputs.scan == 'true'
        working-directory: services/omr
        run: |
          pip install -r requirements-test.txt
          python -m pytest -q

      # Publishing needs the wasm-tools workload (about 30 s to install) and a trimming publish (about a minute),
      # so it only runs when the result is tested in browsers or deployed.
      - name: Install WebAssembly build tools
        if: steps.changes.outputs.publish == 'true'
        run: dotnet workload install wasm-tools

      # Sign-in and saving online (0014) in the deployed app: the External ID tenant and the services' addresses come
      # from repository variables that infra/azure/setup.ps1 sets. Pull request builds keep the committed
      # appsettings.json, with no accounts.
      - name: Write the sign-in settings
        if: >-
          steps.changes.outputs.publish == 'true' && github.event_name != 'pull_request' &&
          vars.AUTH_AUTHORITY != '' && vars.AUTH_CLIENT_ID != '' && vars.AUTH_AUDIENCE != '' && vars.API_URL != ''
        env:
          AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          API_URL: ${{ vars.API_URL }}
          SCAN_URL: ${{ vars.SCAN_URL }}
        run: |
          for address in "$API_URL" "${SCAN_URL:-https://unset}"; do
            if [[ ! "$address" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
              echo "::error::API_URL and SCAN_URL must be plain https addresses; one is: ${address:0:80}"
              exit 1
            fi
          done
          jq -n --arg authority "${AUTHORITY%/v2.0}" --arg client "$CLIENT_ID" --arg audience "$AUDIENCE" \
            --arg api "$API_URL" --arg scan "$SCAN_URL" \
            '{Account: {Authority: $authority, ClientId: $client, ApiScope: "api://\($audience)/Projects.ReadWrite",
              ScanScope: "api://\($audience)/Scan", Api: $api, Scan: $scan}}' \
            > src/MotiffLab.Web/wwwroot/appsettings.json
          cat src/MotiffLab.Web/wwwroot/appsettings.json

      - name: Publish web app
        if: steps.changes.outputs.publish == 'true'
        run: dotnet publish src/MotiffLab.Web --configuration Release --output publish

      # Smoke, offline and accessibility tests of the published app in Chromium, Firefox and WebKit
      # (tests/e2e, issue #66), when asked, before it is deployed. Firefox plays audio only with a sound device,
      # so PulseAudio gives the runner a silent one.
      - uses: actions/cache@v4
        if: steps.changes.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install browsers
        if: steps.changes.outputs.browser == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1

      - name: Test in browsers
        if: steps.changes.outputs.browser == 'true'
        working-directory: tests/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure() && steps.changes.outputs.browser == 'true'
        with:
          name: browser-test-results
          path: tests/e2e/test-results
          retention-days: 7

      # Provisions infra/main.bicep and deploys the published app to Azure Static Web Apps, from main only.
      # Pull requests are built and tested but not deployed: there are no preview sites (Andrei, 2026-10-31;
      # a preview can't sign in, and the iPad app opens the production site), so a change is checked there.
      # Signs in through OIDC as the identity from infra/bootstrap.bicep; see infra/README.md.
      # Skipped until the bootstrap has set the AZURE_* repository variables.
      - uses: azure/login@v2
        if: steps.changes.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Infrastructure is provisioned only when infra/ changed (about 40 s).
      - name: Provision infrastructure
        if: steps.changes.outputs.deploy == 'true' && steps.changes.outputs.infra == 'true'
        run: >-
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --name "main-${{ github.run_number }}"
          --template-file infra/main.bicep
          --parameters infra/main.bicepparam
          --output none

      # The deployment token is read at run time, so it is never stored in GitHub.
      - name: Get deployment token
        if: steps.changes.outputs.deploy == 'true'
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy to Static Web Apps
        if: steps.changes.outputs.deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          output_location: ''
          skip_app_build: true
          skip_api_build: true
