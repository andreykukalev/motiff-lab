name: CI

# The browser tests (tests/e2e) are heavy, so they are not here: browser-tests.yml runs them daily on main,
# on a pull request labelled `browser-tests`, and by hand, and says when they must pass before a release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main, develop]
  # infra/azure/setup.ps1 starts this workflow with browser_tests=false; the input stays so that call still
  # works, and does nothing.
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Unused (the browser tests are in the Browser tests workflow)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Never cancel a run on main:
# it may be provisioning infrastructure. Pull requests group by number, not ref, so a pull request's
# run never shares a group with main. A run for adding or removing a label (agent, role:*, risk:*,
# browser-tests, ipad-tests, protected-scenarios-ok) only reports the result of the build before it and checks
# the approval of the protected scenarios again (see the job), so it gets a group of its own per run: it
# never cancels the build in progress, and no other label run cancels it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # One job for build, test, publish and deploy: a second job would pay for another runner start, checkout,
  # artifact upload and download, and billing rounds each job up to a whole minute.
  # The job name is the required check (the ruleset on main, infra/github/protect.ps1), so it is fixed text and
  # the job always runs and reports; what it skips it skips by step.
  #
  # Adding or removing a label starts a run too (GitHub cannot filter label events by name), and the pull
  # request shows build-test from the newest CI run on its commit. A label run that skipped the job, or reported
  # under another name, hid the real result and left the pull request blocked (#294, #295). So a label run
  # builds nothing: its build-test waits for the CI run on the same commit just before it and reports that
  # run's build-test, passing only if that one passed, or failed only for want of protected-scenarios-ok; then it
  # checks that approval again with the labels as they are now (#310). Label runs that come close together
  # each wait for the one before, down to the real build. To try a failed build again after labels were added,
  # re-run the build, then the newest run (or push).
  build-test:
    name: build-test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Balance rule (governance/roles/common.md, "CI and heavy checks"): the repository is public, so minutes are
    # free, but build-test stays quick (a few minutes) and runs on every pull request; the limit below is a
    # safety net, not a budget. Long suites run only by label or by hand, in their own workflows (the browser
    # tests in browser-tests.yml). A label run builds nothing, but waits for the build before it, so its limit
    # covers that build.
    timeout-minutes: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 15 || 10 }}
    permissions:
      actions: read # a label run reads the run before it
      contents: read
      id-token: write # OIDC sign-in to Azure
      pull-requests: read # the approval of the protected scenarios reads the pull request's files and labels
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SWA_NAME: swa-motifflab
      LABEL_ONLY: ${{ github.event.action == 'labeled' || github.event.action == 'unlabeled' }}
    steps:
      # A run for adding or removing a label: report the build-test of the CI run on this commit just before this
      # one (pull_request runs, by run number), once it has finished. A build-test that failed only in "Check
      # approval of the protected scenarios" counts as built, since that step runs again below with the labels as
      # they are now. Every other step is skipped, since "Find what changed" does not run and sets no outputs.
      - name: Report the build of this commit
        if: env.LABEL_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)"
          while true; do
            before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              --jq "[.workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER)] | max_by(.run_number) // empty | \"\(.id) \(.status)\"")"
            if [[ -z "$before" ]]; then
              echo "::error::No CI run on $HEAD_SHA before this one, so there is no build to report. Push, or re-run the build."
              exit 1
            fi
            read -r id status <<< "$before"
            if [[ "$status" == completed ]]; then
              break
            fi
            echo "Waiting for run $id ($status)"
            sleep 15
          done
          approval='Check approval of the protected scenarios'
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
            --jq "([.jobs[] | select(.name == \"build-test\")][0] // {}) as \$job
              | (\$job.steps // []) as \$steps
              | if \$job.conclusion == \"failure\"
                  and any(\$steps[]; .name == \"$approval\" and .conclusion == \"failure\")
                  and all(\$steps[] | select(.name != \"$approval\"); .conclusion == \"success\" or .conclusion == \"skipped\")
                then \"built, not approved\" else (\$job.conclusion // \"missing\") end")"
          echo "build-test of run $id on $HEAD_SHA: $conclusion"
          echo "### build-test of run [$id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id): $conclusion" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$conclusion" == "built, not approved" ]]; then
            echo "The build passed; the approval of the protected scenarios is checked again below."
          elif [[ "$conclusion" != success ]]; then
            echo "::error::build-test of run $id did not pass ($conclusion)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.LABEL_ONLY != 'true'

      # Documentation-only changes skip the build and tests. Only changes to the app (src, infra, SDK and
      # build settings) are published and deployed; test-only changes are built and tested but not deployed.
      # Any doubt (a commit that cannot be fetched) runs everything.
      - name: Find what changed
        id: changes
        if: env.LABEL_ONLY != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          code=true
          app=true
          infra=true
          scan=true
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --depth=1 --no-tags origin "$BASE_SHA" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            echo "$changed"
            code=false
            app=false
            infra=false
            scan=false
            while IFS= read -r f; do
              case "$f" in
                '') ;;
                *.md|docs/*|design/*|stage1-issues/*|pilot/*|LICENSE*|VERSION|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|.github/workflows/version.yml) ;;
                src/*|infra/*|global.json|Directory.Build.props|Directory.Packages.props|MotiffLab.slnx|.github/workflows/ci.yml)
                  code=true
                  app=true ;;
                services/omr/*) scan=true ;;
                *) code=true ;;
              esac
              case "$f" in
                infra/*) infra=true ;;
              esac
            done <<< "$changed"
          fi
          # main deploys the main address; develop deploys the Static Web App's environment "develop", the web test
          # site (governance/README.md), once Andrei has set the repository variable DEPLOY_DEVELOP to true (the
          # develop branch needs its own sign-in to Azure first: infra/bootstrap.bicep, github-develop).
          azure=false
          site=production
          if [[ "$app" == true && -n "$AZURE_CLIENT_ID" ]] \
            && [[ "${{ github.event_name }}" == push || "${{ github.event_name }}" == workflow_dispatch ]]; then
            if [[ "${{ github.ref }}" == refs/heads/main ]]; then
              azure=true
            elif [[ "${{ github.ref }}" == refs/heads/develop && "${{ vars.DEPLOY_DEVELOP }}" == true ]]; then
              azure=true
              site=develop
              infra=false
            fi
          fi
          publish="$azure"
          # Changes to the agents' own rules (decision 6 in governance/README.md) are flagged: Andrei merges them.
          environment="$(grep -E '^(\.claude/|governance/|\.github/|CLAUDE\.md$|tests/acceptance/)' <<< "${changed:-}" || true)"
          if [[ -n "$environment" && "${{ github.event_name }}" == pull_request ]]; then
            echo "::warning title=env-scope::This pull request changes the agents' rules; Andrei merges it: $(tr '\n' ' ' <<< "$environment")"
            { echo "### env-scope: the agents' rules change (Andrei merges)"; echo; sed 's/^/- /' <<< "$environment"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "deploy=$azure" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "code=$code publish=$publish deploy=$azure infra=$infra scan=$scan"

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        if: steps.changes.outputs.code == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore MotiffLab.slnx

      # Whitespace only, without loading the solution (seconds rather than a minute): code style and
      # analyzers fail the build already (EnforceCodeStyleInBuild with warnings as errors).
      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: dotnet format whitespace --folder --verify-no-changes

      # A quality build: the code-metrics rules (CA1502, CA1505, CA1506) warn without failing it, and the log of
      # those warnings is the input of "Check code quality" below (governance/quality/README.md).
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p artifacts/quality
          dotnet build MotiffLab.slnx --configuration Release --no-restore -p:QualityMetrics=true \
            "-flp1:logfile=artifacts/quality/dotnet-build.log;warningsonly"

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test MotiffLab.slnx --configuration Release --no-build

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.scan == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MotiffLab.Web/package-lock.json

      # The build compiles the TypeScript layer to wwwroot/js; these tests run the compiled engine.
      - name: Test TypeScript layer
        if: steps.changes.outputs.code == 'true'
        run: node --test "tests/web/*.test.mjs"

      # The agents' guards in .claude/hooks (governance/roles/common.md): a second.
      - name: Test agent guards
        if: steps.changes.outputs.code == 'true'
        run: node --test "governance/tests/*.test.mjs"

      # Code quality (#332, governance/quality/README.md): complexity, size and duplication in C#, TypeScript,
      # Swift (SwiftLint in Docker) and Python against the ratchet baseline, in about half a minute. The report
      # goes to the job summary; governance/quality/settings.json is in blocking mode, so a new violation fails
      # build-test. The base commit was fetched by "Find what changed", to list what the baseline gained. A pull
      # request that changes only the scan server (no build) gets the checks that need none: Python duplicates.
      - name: Check code quality
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.scan == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUILT: ${{ steps.changes.outputs.code }}
        run: |
          npm ci --prefix src/MotiffLab.Web --no-audit --no-fund \
            || echo "::warning title=quality::npm ci failed; the quality report says which checks did not run"
          node --test "tools/quality/*.test.mjs"
          if [[ "$BUILT" == true ]]; then
            checks=(--dotnet-log artifacts/quality/dotnet-build.log)
          else
            checks=(--only config,jscpd,suppressions)
          fi
          node tools/quality/quality.mjs --ci "${checks[@]}" --base "$BASE_SHA"

      # The scan server (services/omr, decision record 0011), with homr replaced by a stand-in: a few seconds.
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.scan == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/omr/requirements-test.txt

      - name: Test scan server
        if: steps.changes.outputs.scan == 'true'
        working-directory: services/omr
        run: |
          pip install -r requirements-test.txt
          python -m pytest -q

      # The protected acceptance scenarios (tests/acceptance/README.md, #310): a pull request that adds, changes,
      # removes or renames a file there needs the label protected-scenarios-ok, which only Andrei sets. It runs last
      # in a build and again in every label run, from the pull request's files and labels as GitHub has them now.
      # A file list shorter than the pull request's count of changed files counts as touching the scenarios.
      - name: Check approval of the protected scenarios
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          label=protected-scenarios-ok
          pull="repos/$GITHUB_REPOSITORY/pulls/$PR"
          count="$(gh api "$pull" --jq .changed_files)"
          labels="$(gh api "$pull" --jq '.labels[].name')"
          files="$(gh api --paginate "$pull/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          listed="$(gh api --paginate "$pull/files?per_page=100" --jq '.[].filename' | grep -c . || true)"
          protected="$(grep -E '^tests/acceptance/' <<< "$files" | sort -u || true)"
          if (( listed < count )); then
            protected="${protected:-(GitHub listed $listed of $count changed files, so the rest may touch tests/acceptance)}"
          fi
          if [[ -z "$protected" ]]; then
            echo "No protected acceptance scenario changes."
            exit 0
          fi
          { echo '### Protected acceptance scenarios (tests/acceptance)'; echo; sed 's/^/- /' <<< "$protected"; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qxF "$label" <<< "$labels"; then
            echo "The protected scenarios change with the label $label."
            exit 0
          fi
          echo "::error title=$label::This pull request changes the protected acceptance scenarios, which only Andrei approves: it needs the label $label. $(tr '\n' ' ' <<< "$protected")"
          exit 1

      # Publishing needs the wasm-tools workload (about 30 s to install) and a trimming publish (about a minute),
      # so it only runs when the result is deployed.
      - name: Install WebAssembly build tools
        if: steps.changes.outputs.publish == 'true'
        run: dotnet workload install wasm-tools

      # Sign-in and saving online (0014) in the deployed app: the External ID tenant and the services' addresses come
      # from repository variables that infra/azure/setup.ps1 sets. Pull request builds keep the committed
      # appsettings.json, with no accounts.
      - name: Write the sign-in settings
        if: >-
          steps.changes.outputs.publish == 'true' && github.event_name != 'pull_request' && steps.changes.outputs.site == 'production' &&
          vars.AUTH_AUTHORITY != '' && vars.AUTH_CLIENT_ID != '' && vars.AUTH_AUDIENCE != '' && vars.API_URL != ''
        env:
          AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          API_URL: ${{ vars.API_URL }}
          SCAN_URL: ${{ vars.SCAN_URL }}
        run: |
          for address in "$API_URL" "${SCAN_URL:-https://unset}"; do
            if [[ ! "$address" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
              echo "::error::API_URL and SCAN_URL must be plain https addresses; one is: ${address:0:80}"
              exit 1
            fi
          done
          jq -n --arg authority "${AUTHORITY%/v2.0}" --arg client "$CLIENT_ID" --arg audience "$AUDIENCE" \
            --arg api "$API_URL" --arg scan "$SCAN_URL" \
            '{Account: {Authority: $authority, ClientId: $client, ApiScope: "api://\($audience)/Projects.ReadWrite",
              ScanScope: "api://\($audience)/Scan", Api: $api, Scan: $scan}}' \
            > src/MotiffLab.Web/wwwroot/appsettings.json
          cat src/MotiffLab.Web/wwwroot/appsettings.json

      - name: Publish web app
        if: steps.changes.outputs.publish == 'true'
        run: dotnet publish src/MotiffLab.Web --configuration Release --output publish

      # Provisions infra/main.bicep (from main only) and deploys the published app to Azure Static Web Apps: main to
      # the main address, develop to the environment "develop" (the web test site, without sign-in: its address is
      # not a registered redirect). Pull requests are built and tested but not deployed.
      # Signs in through OIDC as the identity from infra/bootstrap.bicep; see infra/README.md.
      # Skipped until the bootstrap has set the AZURE_* repository variables.
      - uses: azure/login@v2
        if: steps.changes.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Infrastructure is provisioned only when infra/ changed (about 40 s).
      - name: Provision infrastructure
        if: steps.changes.outputs.deploy == 'true' && steps.changes.outputs.infra == 'true'
        run: >-
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --name "main-${{ github.run_number }}"
          --template-file infra/main.bicep
          --parameters infra/main.bicepparam
          --output none

      # The deployment token is read at run time, so it is never stored in GitHub.
      - name: Get deployment token
        if: steps.changes.outputs.deploy == 'true'
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy to Static Web Apps
        if: steps.changes.outputs.deploy == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ${{ steps.changes.outputs.site == 'develop' && 'develop' || '' }}
