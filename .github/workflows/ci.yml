name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MotiffLab.slnx

      - name: Check formatting
        run: dotnet format MotiffLab.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MotiffLab.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MotiffLab.slnx --configuration Release --no-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The build compiles the TypeScript layer to wwwroot/js; these tests run the compiled engine.
      - name: Test TypeScript layer
        run: node --test "tests/web/*.test.mjs"

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Publish web app
        run: dotnet publish src/MotiffLab.Web --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/wwwroot

  # Provisions infra/main.bicep and deploys the published app to Azure Static Web Apps.
  # main: provision, then deploy production. Pull requests: what-if, then deploy a preview.
  # Signs in through OIDC as the identity from infra/bootstrap.bicep; see infra/README.md.
  # Skipped until the bootstrap has set the AZURE_* repository variables, and on forks.
  deploy:
    needs: build-test
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      # Never cancel a production provision halfway; superseded previews can go.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
      pull-requests: write # the deploy action comments the preview URL on the PR
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SWA_NAME: swa-motifflab
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        if: github.event_name == 'pull_request'
        run: >-
          az deployment group what-if
          --resource-group "$RESOURCE_GROUP"
          --template-file infra/main.bicep
          --parameters infra/main.bicepparam

      - name: Provision infrastructure
        if: github.event_name == 'push'
        run: >-
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --name "main-${{ github.run_number }}"
          --template-file infra/main.bicep
          --parameters infra/main.bicepparam
          --output none

      # The deployment token is read at run time, so it is never stored in GitHub.
      - name: Get deployment token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SWA_NAME: swa-motifflab
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: close
          app_location: ''
