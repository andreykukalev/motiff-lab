name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MotiffLab.slnx

      - name: Check formatting
        run: dotnet format MotiffLab.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MotiffLab.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MotiffLab.slnx --configuration Release --no-build

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Publish web app
        run: dotnet publish src/MotiffLab.Web --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/wwwroot

  # Deploys the published app to Azure Static Web Apps: main goes to production,
  # each pull request gets its own preview environment. See infra/README.md.
  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # the deploy action comments the preview URL on the PR
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      # Forks and repositories without the secret skip the deploy instead of failing.
      - name: Check deployment token
        id: token
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: web
          path: web

      - name: Deploy to Static Web Apps
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: close
          app_location: ''
