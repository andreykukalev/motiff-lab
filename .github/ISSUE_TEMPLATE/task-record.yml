# Task Record (AOM v1.3, governance/roles/common.md): one task, its acceptance criteria and its scope.
# The headings below are read by governance/metrics/collect.mjs; rename them only together with it.
name: Task (Task Record)
description: One task for the agents, with acceptance criteria, a risk class and a scope
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Andrei approves the acceptance criteria before work starts, with the label `aom:criteria-approved`. Once approved, they are not edited: if it needs to be different, that is Andrei's decision in a comment, or a new task.

        Keep the body to about 4 KB: goal, criteria, scope, checks and stops. Quoted sources and background go into a linked file (under `/mnt/project-files/` or the decision record), which the Reviewer and QA open only when a criterion needs it.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Which problem of the player or of the project the task solves, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A numbered list. Each criterion can be checked (with a command, a test, a scenario or an action on the iPad) and describes the result, not the way to get it.
      placeholder: |
        1. On an empty library the button "Add a piece" is visible, and it opens the file picker (web and iPad).
        2. The text exists in Russian and English.
        3. Existing projects open as before.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the task deliberately does not do.
  - type: dropdown
    id: risk
    attributes:
      label: Risk class
      description: Not below the minimum by path from the AOM table. Any role can raise it; only Andrei lowers it.
      options:
        - Low
        - Standard
        - High
        - Guardrail
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Track
      description: The product or the agents' environment (.claude/, governance/, .github/, CLAUDE.md, tests/acceptance/).
      options:
        - Product Delivery
        - Environment E1 (instructions and documents)
        - Environment E2 (hooks, skills, checks)
        - Environment E3 (permissions, branch rules, workflows, Environments)
    validations:
      required: true
  - type: input
    id: components
    attributes:
      label: Components
      description: Comma-separated, for example web-ui, music-core, facade, ipad-app, api, scan-server.
    validations:
      required: true
  - type: textarea
    id: allowed-paths
    attributes:
      label: allowed_paths
      description: The paths the task may change, one per line, glob as in CODEOWNERS (* within a folder, ** across folders). A file outside them is a stop condition.
      render: text
      placeholder: |
        src/MotiffLab.Web/Pages/Library*
        tests/web/library*
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Web (dev site)
        - label: iPad
        - label: API
        - label: Scan server
        - label: Documents or agent environment only
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Numbers of tasks or PRs, for example #12, #15. Empty if it depends on nothing.
  - type: textarea
    id: checks
    attributes:
      label: How to check
      description: Which tests, e2e specs, acceptance scenarios, checks on the iPad or on the dev site the risk class needs.
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop conditions
      description: When the agent stops and asks. The common ones already hold (a file outside allowed_paths, a contract, a right, an unclear criterion, a guard that fired); here go the ones of this task.
